<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぶん投げ部屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 1画面ゲーム：打ちっぱなしコンクリの部屋を全面キャンバスで描き、上下に半透明HUD。単一テーマ（暗め）で固定 */
:root{
  --room:#2a2e31;
  --ink:#f4f1ec;
  --ink-dim:#b7bcc0;
  --panel:rgba(16,18,20,.8);
  --line:rgba(255,255,255,.16);
  --accent:#ff5b24;
  --accent-ink:#1b0c05;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--room);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud-top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hud-top>*{pointer-events:auto}
.score{display:grid;gap:2px}
.score .label{font-size:11px;letter-spacing:.12em;color:var(--ink-dim)}
.score b{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:3px 3px 0 var(--accent-ink)}
.score .sub{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}

.btn-ghost{font:700 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.btn-ghost:focus-visible,.chip:focus-visible,.primary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hud-bottom{position:fixed;left:0;right:0;bottom:0;padding:28px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to top,rgba(14,15,17,.9) 40%,rgba(14,15,17,0));display:grid;gap:10px;pointer-events:none}
.meter{display:grid;gap:6px;max-width:520px}
.meter-label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;color:var(--ink-dim)}
.meter-label b{font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.meter-track{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#meterLive{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:4px}
#meterPeak{position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--ink);opacity:0;transition:left .15s}
.chips{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.chip{font:700 14px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer}
.chip[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#status{margin:0;font-size:13px;color:var(--ink-dim);min-height:1.4em}
#status.warn{color:#ffc19f}

.overlay{position:fixed;inset:0;background:rgba(12,13,15,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 32px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);display:flex}
.card{margin:auto;width:100%;max-width:420px;display:grid;gap:16px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.16em;color:var(--accent)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(52px,17vw,78px);line-height:1.02;text-wrap:balance;text-shadow:5px 5px 0 var(--accent)}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px}
.how{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.how li{display:grid;grid-template-columns:28px 1fr;align-items:baseline;line-height:1.55;counter-increment:s}
.how li::before{content:counter(s);font-family:var(--f-display);color:var(--accent);font-size:17px}
.safety{margin:0;font-size:13px;line-height:1.6;color:#ffd6c2;border-left:3px solid var(--accent);padding-left:12px}
.field{display:grid;gap:6px}
.field label,.field .lab{font-size:12px;letter-spacing:.1em;color:var(--ink-dim)}
input[type=text]{font:500 16px var(--f-body);color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:6px;padding:12px 14px;width:100%;box-sizing:border-box}
input::placeholder{color:#80868b}
.primary{font:400 20px var(--f-display);color:var(--accent-ink);background:var(--accent);border:0;border-radius:6px;padding:16px;cursor:pointer;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.note{margin:0;font-size:12px;line-height:1.6;color:var(--ink-dim)}
</style>
</head>
<body>

<canvas id="stage" aria-label="ゲーム画面。棚の上の花瓶をタップで狙い、スマホを振るか画面を上にはじいて投げる"></canvas>

<header class="hud-top">
  <div class="score">
    <span class="label">割った数</span>
    <b id="count">0</b>
    <span class="sub">通算 <span id="total">0</span></span>
  </div>
  <button id="btnSettings" class="btn-ghost" type="button">設定</button>
</header>

<footer class="hud-bottom">
  <div class="meter">
    <div class="meter-label"><span>スイング強度</span><b id="powerNum">—</b></div>
    <div class="meter-track"><div id="meterLive"></div><div id="meterPeak"></div></div>
  </div>
  <div class="chips" role="radiogroup" aria-label="投げる物">
    <button class="chip" role="radio" aria-checked="true" data-obj="ball" id="obj-ball" type="button">ボール</button>
    <button class="chip" role="radio" aria-checked="false" data-obj="plate" id="obj-plate" type="button">お皿</button>
    <button class="chip" role="radio" aria-checked="false" data-obj="cup" id="obj-cup" type="button">コップ</button>
  </div>
  <p id="status">棚の上をタップして狙いを決める</p>
</footer>

<div id="intro" class="overlay">
  <div class="card">
    <p class="eyebrow">スマホで物を投げて割る部屋</p>
    <h1>ぶん投げ<br>部屋</h1>
    <ol class="how">
      <li>棚の上の割りたいものをタップして狙う</li>
      <li>スマホを握って、ボールを投げるように振る</li>
      <li>センサーが使えないときは、画面を上にはじいて投げる</li>
    </ol>
    <p class="safety">ストラップを手首に通すか、しっかり握って。まわりに人や物がないのを確かめてから振ってください。</p>
    <div class="field">
      <label for="wordIntro">割りたいもの（任意・8文字まで）</label>
      <input id="wordIntro" type="text" maxlength="8" placeholder="例：月曜日" autocomplete="off">
    </div>
    <button id="btnStart" class="primary" type="button">はじめる</button>
  </div>
</div>

<div id="settings" class="overlay" hidden>
  <div class="card">
    <h2>設定</h2>
    <div class="field">
      <span class="lab" id="sensLab">振りの感度</span>
      <div class="row" role="radiogroup" aria-labelledby="sensLab">
        <button class="chip" role="radio" aria-checked="true" data-sens="soft" id="sens-soft" type="button">軽く振ってOK</button>
        <button class="chip" role="radio" aria-checked="false" data-sens="normal" id="sens-normal" type="button">ふつう</button>
        <button class="chip" role="radio" aria-checked="false" data-sens="hard" id="sens-hard" type="button">思いきり</button>
      </div>
      <p class="note">「軽く振ってOK」なら小さな振りでも強く飛びます。大きく振り回さなくて大丈夫。</p>
    </div>
    <div class="field">
      <label for="wordSet">割りたいもの（花瓶に書かれます）</label>
      <input id="wordSet" type="text" maxlength="8" placeholder="例：締め切り" autocomplete="off">
    </div>
    <div class="row">
      <button id="btnClean" class="btn-ghost" type="button">床を片付ける</button>
      <button id="btnRestock" class="btn-ghost" type="button">棚を補充する</button>
    </div>
    <button id="btnClose" class="primary" type="button">戻る</button>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#stage'),ctx=cv.getContext('2d');
const bg=document.createElement('canvas'),bx=bg.getContext('2d');
let deb=document.createElement('canvas'),dx=deb.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=0,H=0,DPR=1,shelfY=0,floorY=0,itemH=0,slotW=0,nSlots=3,margin=0,G=1000,projR=24;
let items=[],frags=[],projs=[],pops=[],dusts=[];
let aimX=0,shake=0,flash=0,count=0,total=0,restockAt=0,started=false,lastPower=0,clock=0;
let objKind='ball',sens='soft',word='';
try{total=+localStorage.getItem('bunnage_total')||0}catch(e){}

/* ---------- 器のかたち ---------- */
const PROFILES={
  vase:[[0,.26],[.1,.36],[.42,.5],[.72,.3],[.84,.16],[.94,.2],[1,.23]],
  tall:[[0,.2],[.18,.3],[.55,.27],[.85,.15],[.95,.19],[1,.22]],
  jar:[[0,.3],[.12,.4],[.55,.46],[.85,.36],[.92,.3],[1,.32]],
  gourd:[[0,.28],[.22,.42],[.44,.24],[.6,.3],[.78,.2],[.92,.1],[1,.12]],
  bottle:[[0,.24],[.05,.26],[.55,.26],[.68,.2],[.76,.09],[.96,.09],[1,.11]]
};
const STYLES=[
  {body:'#8fb8a6',band:null,kind:'ceramic',prof:['vase','jar','tall']},
  {body:'#eceee9',band:'#2c4f9a',kind:'ceramic',prof:['vase','jar','gourd']},
  {body:'#27479a',band:'#d8b34b',kind:'ceramic',prof:['tall','vase']},
  {body:'#c2683f',band:'#7a3b22',kind:'ceramic',prof:['jar','vase','gourd']},
  {body:'#2e2926',band:'#9a6a44',kind:'ceramic',prof:['tall','jar']},
  {body:'#2f8052',band:null,kind:'glass',prof:['bottle']},
  {body:'#8a531f',band:null,kind:'glass',prof:['bottle']}
];
function interp(pr,t){for(let i=1;i<pr.length;i++){if(t<=pr[i][0]){const a=pr[i-1],b=pr[i];const u=(t-a[0])/(b[0]-a[0]);return lerp(a[1],b[1],(1-Math.cos(u*Math.PI))/2)}}return pr[pr.length-1][1]}
const HWK=.8;
function maxHW(it){return Math.max(...PROFILES[it.prof].map(p=>p[1]))*it.h*HWK}
function outline(it){
  const pr=PROFILES[it.prof],pts=[],S=14,y=it.y+it.yOff;
  for(let i=0;i<=S;i++){const t=i/S;pts.push([it.x+interp(pr,t)*it.h*HWK,y-t*it.h])}
  for(let i=S;i>=0;i--){const t=i/S;pts.push([it.x-interp(pr,t)*it.h*HWK,y-t*it.h])}
  return pts;
}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function shade(h,k){const c=hexRgb(h).map(v=>Math.round(k>0?v+(255-v)*k:v*(1+k)));return`rgb(${c[0]},${c[1]},${c[2]})`}
function isLight(h){const[r,g,b]=hexRgb(h);return(r*.299+g*.587+b*.114)>150}

function makeItem(i,drop){
  const st=STYLES[Math.floor(Math.random()*STYLES.length)];
  const prof=st.prof[Math.floor(Math.random()*st.prof.length)];
  const k=(prof==='tall'||prof==='bottle')?1.08:prof==='jar'?.82:1;
  return{slot:i,x:margin+slotW*(i+.5),y:shelfY-2,h:itemH*k*rand(.93,1.03),k,prof,st,alive:true,yOff:drop?-rand(H*.45,H*.75):0,vy:0,wob:0,wobT:0};
}
function restock(drop){items=[];for(let i=0;i<nSlots;i++)items.push(makeItem(i,drop));restockAt=0}

/* ---------- 部屋（背景は一度だけ描いてキャッシュ） ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawBG(){
  bg.width=W*DPR;bg.height=H*DPR;const b=bx;b.setTransform(DPR,0,0,DPR,0,0);const R=mulberry(11);
  let g=b.createLinearGradient(0,0,0,floorY);g.addColorStop(0,'#4c5358');g.addColorStop(.55,'#6b7277');g.addColorStop(1,'#596065');
  b.fillStyle=g;b.fillRect(0,0,W,floorY);
  for(let i=0;i<16;i++){const x=R()*W,y=R()*floorY,r=40+R()*140;const rg=b.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(${R()<.5?'0,0,0':'255,255,255'},${.03+R()*.04})`);rg.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=rg;b.fillRect(x-r,y-r,r*2,r*2)}
  for(let i=0;i<W*floorY/80;i++){b.fillStyle=R()<.55?`rgba(0,0,0,${.05+R()*.09})`:`rgba(255,255,255,${.03+R()*.06})`;const s=R()*1.8+.4;b.fillRect(R()*W,R()*floorY,s,s)}
  // 型枠の継ぎ目とPコン跡
  const cols=Math.max(2,Math.round(W/320)),pw=W/cols,ph=pw*.5,hr=clamp(W*.009,3,6);
  for(let y=floorY;y>-ph;y-=ph){
    b.fillStyle='rgba(0,0,0,.2)';b.fillRect(0,y-1,W,1);b.fillStyle='rgba(255,255,255,.06)';b.fillRect(0,y,W,1);
    for(let c=0;c<cols;c++){
      const x0=c*pw;if(c>0){b.fillStyle='rgba(0,0,0,.2)';b.fillRect(x0-1,y-ph,1,ph);b.fillStyle='rgba(255,255,255,.06)';b.fillRect(x0,y-ph,1,ph)}
      for(const[fx,fy]of[[.25,.25],[.75,.25],[.25,.75],[.75,.75]]){
        const cx=x0+pw*fx,cy=y-ph+ph*fy;if(cy<0)continue;
        const hg=b.createRadialGradient(cx-1,cy-1,0,cx,cy,hr*1.4);hg.addColorStop(0,'rgba(20,22,24,.75)');hg.addColorStop(.6,'rgba(40,43,46,.55)');hg.addColorStop(.75,'rgba(255,255,255,.12)');hg.addColorStop(1,'rgba(0,0,0,0)');
        b.fillStyle=hg;b.beginPath();b.arc(cx,cy,hr*1.4,0,7);b.fill();
      }
    }
  }
  const lg=b.createRadialGradient(W/2,-H*.1,0,W/2,-H*.1,H*.95);lg.addColorStop(0,'rgba(255,232,205,.24)');lg.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=lg;b.fillRect(0,0,W,floorY);
  // 床
  g=b.createLinearGradient(0,floorY,0,H);g.addColorStop(0,'#2c3033');g.addColorStop(1,'#3b4043');b.fillStyle=g;b.fillRect(0,floorY,W,H-floorY);
  for(let i=0;i<W*(H-floorY)/70;i++){b.fillStyle=R()<.5?`rgba(0,0,0,${.06+R()*.08})`:`rgba(255,255,255,${.02+R()*.05})`;const s=R()*2+.4;b.fillRect(R()*W,floorY+R()*(H-floorY),s,s)}
  const vpX=W/2,vpY=floorY-H*.55;b.strokeStyle='rgba(0,0,0,.28)';b.lineWidth=1;
  for(let k=-5;k<=5;k++){const x=vpX+k*W*.24;const t=(H-vpY)/(floorY-vpY);b.beginPath();b.moveTo(x,floorY);b.lineTo(vpX+(x-vpX)*t,H);b.stroke()}
  g=b.createLinearGradient(0,floorY,0,floorY+18);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=g;b.fillRect(0,floorY,W,18);
  g=b.createLinearGradient(0,floorY-40,0,floorY);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.25)');b.fillStyle=g;b.fillRect(0,floorY-40,W,40);
  // 棚（合板）
  const x0=W*.03,x1=W*.97;
  g=b.createLinearGradient(0,shelfY+14,0,shelfY+50);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=g;b.fillRect(x0+6,shelfY+14,x1-x0-12,36);
  b.fillStyle='#2b2d2f';
  for(const bx0 of[x0+W*.1,x1-W*.1]){b.beginPath();b.moveTo(bx0-3,shelfY+14);b.lineTo(bx0+3,shelfY+14);b.lineTo(bx0+3,shelfY+40);b.lineTo(bx0-3,shelfY+20);b.closePath();b.fill()}
  b.fillStyle='#d6ab76';b.fillRect(x0,shelfY-6,x1-x0,6);
  b.fillStyle='#b5854f';b.fillRect(x0,shelfY,x1-x0,14);
  const plies=['#c99b63','#9d6d3f','#c99b63','#a77746','#c99b63'];plies.forEach((c,i)=>{b.fillStyle=c;b.fillRect(x0,shelfY+1+i*2.6,x1-x0,1.2)});
  b.fillStyle='rgba(255,255,255,.18)';b.fillRect(x0,shelfY-6,x1-x0,1);
}

/* ---------- レイアウト ---------- */
function resize(){
  const oldW=W,oldDeb=deb;
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  shelfY=H*.44;floorY=H*.70;G=H*2.4;
  nSlots=clamp(Math.floor(W/125),3,6);margin=W*.07;slotW=(W-margin*2)/nSlots;
  itemH=Math.min(slotW*.95,H*.22,190);projR=clamp(W*.065,20,34);
  drawBG();
  const nd=document.createElement('canvas');nd.width=W*DPR;nd.height=H*DPR;const ndx=nd.getContext('2d');
  if(oldW&&oldDeb.width)ndx.drawImage(oldDeb,0,0,nd.width,nd.height);
  ndx.setTransform(DPR,0,0,DPR,0,0);deb=nd;dx=ndx;
  if(items.length===nSlots){items.forEach(it=>{it.x=margin+slotW*(it.slot+.5);it.y=shelfY-2;it.h=itemH*it.k})}else restock(false);
  if(!aimX||!oldW)aimX=items[Math.floor(nSlots/2)].x;else aimX=aimX/oldW*W;
}
window.addEventListener('resize',resize);

/* ---------- 音（全部その場で合成） ---------- */
const sfx={
  ac:null,out:null,noise:null,lastTink:0,
  init(){if(this.ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=this.ac=new AC();
    const comp=ac.createDynamicsCompressor();this.out=ac.createGain();this.out.gain.value=.9;this.out.connect(comp);comp.connect(ac.destination);
    const len=ac.sampleRate;const buf=ac.createBuffer(1,len,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noise=buf},
  resume(){if(this.ac&&this.ac.state==='suspended')this.ac.resume()},
  nz(t,dur,type,f0,q,gain,f1,att=.004){const ac=this.ac;if(!ac)return;const s=ac.createBufferSource();s.buffer=this.noise;s.loop=true;
    const f=ac.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;
    const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.out);s.start(t,Math.random()*.5);s.stop(t+dur+.05)},
  tone(t,f0,f1,dur,type,gain){const ac=this.ac;if(!ac)return;const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.out);o.start(t);o.stop(t+dur+.02)},
  whoosh(p){if(!this.ac)return;const t=this.ac.currentTime;this.nz(t,.3,'bandpass',300,1.3,.2+.35*p,1900,.09)},
  smash(p,kind){if(!this.ac)return;const t=this.ac.currentTime,gl=kind==='glass';
    this.nz(t,.1+.1*p,'highpass',gl?3200:1700,.7,.95);
    this.nz(t,.35+.4*p,'bandpass',gl?6200:3000,.9,.32);
    this.tone(t,gl?320:170,48,.2,'sine',.45+.4*p);
    const n=10+Math.round(18*p);
    for(let i=0;i<n;i++){const d=Math.pow(Math.random(),1.8)*(.5+.4*p)+.02;const f=rand(gl?3600:2200,gl?8200:5600);this.tone(t+d,f,f*rand(.96,1),rand(.03,.12),'triangle',rand(.025,.08))}},
  thud(p){if(!this.ac)return;const t=this.ac.currentTime;this.tone(t,115,40,.24,'sine',.35+.45*p);this.nz(t,.14,'lowpass',520,.7,.25+.3*p)},
  clunk(){if(!this.ac)return;const t=this.ac.currentTime;this.tone(t,230,120,.08,'triangle',.14);this.nz(t,.05,'bandpass',900,2,.12)},
  tink(){if(!this.ac)return;const now=this.ac.currentTime;if(now-this.lastTink<.03)return;this.lastTink=now;const f=rand(3000,6500);this.tone(now,f,f,.05,'triangle',.025)}
};
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- 破片 ---------- */
function lp(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t)]}
function landY(){return floorY+4+Math.pow(Math.random(),1.4)*(H-floorY)*.42}
function addFrag(poly,px,py,color,glass,power,sp=1){
  let cx=0,cy=0;poly.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=poly.length;cy/=poly.length;
  let vx=cx-px,vy=cy-py;const d=Math.hypot(vx,vy)||1;vx/=d;vy/=d;
  const s=(120+W*.9*power)*rand(.35,1.1)*sp;
  frags.push({x:cx,y:cy,vx:vx*s+rand(-40,40),vy:vy*s-rand(60,260)*(.5+power),rot:0,vr:rand(-12,12),pts:poly.map(p=>[p[0]-cx,p[1]-cy]),color,glass,land:landY(),rest:0});
}
function shatterPoly(pts,px,py,body,band,kind,power,sp=1){
  const glass=kind==='glass',P=[px,py],idx=[];
  for(let i=0;i<pts.length;i+=2)idx.push(i);
  const rings=idx.map(()=>[rand(.22,.42),rand(.55,.8)]);
  const col=()=>band&&Math.random()<.25?shade(band,rand(-.1,.1)):shade(body,rand(-.14,.1));
  for(let k=0;k<idx.length;k++){
    const a=pts[idx[k]],b=pts[idx[(k+1)%idx.length]],ra=rings[k],rb=rings[(k+1)%idx.length];
    const a1=lp(P,a,ra[0]),b1=lp(P,b,rb[0]),a2=lp(P,a,ra[1]),b2=lp(P,b,rb[1]);
    addFrag([P,a1,b1],px,py,col(),glass,power,sp);
    addFrag([a1,a2,b2,b1],px,py,col(),glass,power,sp);
    addFrag([a2,a,b,b2],px,py,col(),glass,power,sp);
  }
  for(let i=0;i<14;i++){const x=px+rand(-10,10),y=py+rand(-10,10),s=rand(2,5);addFrag([[x,y],[x+s,y+rand(-s,s)],[x+rand(-s,s),y+s]],px,py,col(),glass,power*1.2,sp)}
}
function dustBurst(x,y,n,glass){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(30,220);dusts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,r:rand(1.5,glass?2.5:5),life:0,max:rand(.4,.9),glass})}}

/* ---------- 投げる ---------- */
function circlePts(x,y,rx,ry,n){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry])}return p}
function throwIt(power){
  if(!started||projs.length>=3)return;
  power=clamp(power,.2,1);
  const spread=rand(-1,1)*slotW*.16*(.3+power);
  const tx=clamp(aimX+spread,12,W-12),ty=shelfY-itemH*rand(.25,.68);
  projs.push({kind:objKind,x0:W*.5+rand(-12,12),y0:H+40,tx,ty,t:0,dur:lerp(.62,.3,power),power,rot:0,spin:rand(8,16)*(Math.random()<.5?-1:1),arc:H*lerp(.16,.05,power),x:0,y:0,s:1});
  sfx.whoosh(power);buzz(12);
  lastPower=power;$('#powerNum').textContent=Math.round(power*100);
  const mp=$('#meterPeak');mp.style.opacity=1;mp.style.left=`calc(${power*100}% - 3px)`;
}
function hitTest(it,x,y){if(!it.alive||it.yOff<-4)return false;const top=it.y-it.h;if(y<top||y>it.y)return false;const t=(it.y-y)/it.h;return Math.abs(x-it.x)<=interp(PROFILES[it.prof],t)*it.h*HWK+projR*.3}
const WORDS_C=['ガシャーン','ガチャーン','バリーン','ガシャッ'],WORDS_G=['パリーン','パリン','ガシャーン'];
function impact(p){
  const it=items.find(i=>hitTest(i,p.tx,p.ty)),r=projR*p.s;
  if(it){
    it.alive=false;
    shatterPoly(outline(it),p.tx,p.ty,it.st.body,it.st.band,it.st.kind,p.power);
    dustBurst(p.tx,p.ty,it.st.kind==='glass'?16:26,it.st.kind==='glass');
    const list=it.st.kind==='glass'?WORDS_G:WORDS_C;
    pops.push({text:(p.power>.85?'ガッシャーン':list[Math.floor(Math.random()*list.length)])+(p.power>.6?'!!':'!'),x:clamp(p.tx,W*.2,W*.8),y:p.ty-itemH*.55,t:0,size:clamp(W*.07,26,44)*(.8+.6*p.power),rot:rand(-.18,.18)});
    shake=reduceMotion?0:8+16*p.power;flash=.1+.18*p.power;
    count++;total++;try{localStorage.setItem('bunnage_total',total)}catch(e){}
    $('#count').textContent=count;$('#total').textContent=total;
    sfx.smash(p.power,it.st.kind);buzz([35,25,90]);
    items.forEach(o=>{if(o.alive&&Math.abs(o.x-it.x)<slotW*1.2){o.wob=.05+.05*p.power;o.wobT=0}});
    if(items.every(o=>!o.alive))restockAt=clock+1.1;
  }else{
    dustBurst(p.tx,p.ty,12,false);shake=reduceMotion?0:3+4*p.power;
    if(p.kind==='ball')sfx.thud(p.power);
  }
  if(p.kind==='ball'){
    frags.push({ball:true,r,x:p.tx,y:p.ty,vx:rand(-90,90),vy:it?-rand(60,180):rand(0,60),rot:p.rot,vr:p.spin*.3,land:landY(),rest:0});
  }else if(p.kind==='plate'){
    shatterPoly(circlePts(p.tx,p.ty,r*1.25,r*1.25,24),p.tx+rand(-4,4),p.ty+rand(-4,4),'#f3f1ea','#2c4f9a','ceramic',p.power*.6,.7);
    if(!it)sfx.smash(p.power*.5,'ceramic');
  }else{
    const w=r*.8,h=r*1.5;
    shatterPoly([[p.tx-w,p.ty-h],[p.tx,p.ty-h*1.02],[p.tx+w,p.ty-h],[p.tx+w*.85,p.ty],[p.tx+w*.7,p.ty+h],[p.tx,p.ty+h],[p.tx-w*.7,p.ty+h],[p.tx-w*.85,p.ty]],p.tx,p.ty,'#cfe6ef',null,'glass',p.power*.6,.7);
    if(!it)sfx.smash(p.power*.5,'glass');
  }
}

/* ---------- 描画 ---------- */
function drawBall(c,x,y,r,rot){
  c.save();c.translate(x,y);c.rotate(rot||0);
  const g=c.createRadialGradient(-r*.35,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#fffdf7');g.addColorStop(1,'#cfc7b6');
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,7);c.fill();
  c.strokeStyle='#c8322b';c.lineWidth=Math.max(1,r*.08);c.setLineDash([r*.12,r*.1]);
  c.beginPath();c.arc(-r*1.35,0,r*.95,-.75,.75);c.stroke();c.beginPath();c.arc(r*1.35,0,r*.95,Math.PI-.75,Math.PI+.75);c.stroke();
  c.setLineDash([]);c.restore();
}
function drawPlate(c,x,y,r,rot){
  c.save();c.translate(x,y);c.rotate(rot);
  c.fillStyle='#f3f1ea';c.beginPath();c.arc(0,0,r*1.25,0,7);c.fill();
  c.strokeStyle='#2c4f9a';c.lineWidth=r*.12;c.beginPath();c.arc(0,0,r*1.08,0,7);c.stroke();
  c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=1.5;c.beginPath();c.arc(0,0,r*.7,0,7);c.stroke();
  c.restore();
}
function drawCup(c,x,y,r,rot){
  const w=r*.8,h=r*1.5;c.save();c.translate(x,y);c.rotate(rot*.4);
  c.fillStyle='rgba(205,230,240,.55)';c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1.5;
  c.beginPath();c.moveTo(-w,-h);c.lineTo(w,-h);c.lineTo(w*.72,h);c.lineTo(-w*.72,h);c.closePath();c.fill();c.stroke();
  c.fillStyle='rgba(255,255,255,.55)';c.fillRect(-w*.6,-h*.8,w*.18,h*1.5);c.restore();
}
function drawFrag(c,f){
  if(f.ball){drawBall(c,f.x,f.y,f.r,f.rot);return}
  c.save();c.translate(f.x,f.y);c.rotate(f.rot);
  c.beginPath();f.pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
  c.globalAlpha=f.glass?.8:1;c.fillStyle=f.color;c.fill();
  c.lineWidth=1;c.strokeStyle=f.glass?'rgba(255,255,255,.6)':'rgba(255,246,232,.38)';c.stroke();
  c.restore();
}
function drawItem(it){
  const pts=outline(it),hw=maxHW(it),y=it.y+it.yOff,st=it.st;
  const near=clamp(1+it.yOff/80,0,1);
  if(near>0){ctx.fillStyle=`rgba(0,0,0,${.3*near})`;ctx.beginPath();ctx.ellipse(it.x,it.y,interp(PROFILES[it.prof],0)*it.h*HWK*1.25,4,0,0,7);ctx.fill()}
  ctx.save();
  if(it.wob>.002){ctx.translate(it.x,it.y);ctx.rotate(Math.sin(it.wobT*22)*it.wob);ctx.translate(-it.x,-it.y)}
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  ctx.globalAlpha=st.kind==='glass'?.9:1;ctx.fillStyle=st.body;ctx.fill();ctx.globalAlpha=1;
  ctx.save();ctx.clip();
  if(st.band){ctx.fillStyle=st.band;ctx.fillRect(it.x-hw,y-it.h*.66,hw*2,it.h*.05);ctx.fillRect(it.x-hw,y-it.h*.2,hw*2,it.h*.025);ctx.fillRect(it.x-hw,y-it.h*.14,hw*2,it.h*.012)}
  const g=ctx.createLinearGradient(it.x-hw,0,it.x+hw,0);
  g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(.28,'rgba(255,255,255,.14)');g.addColorStop(.36,'rgba(255,255,255,.34)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=g;ctx.fillRect(it.x-hw,y-it.h,hw*2,it.h);
  if(st.kind==='glass'){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(it.x-hw*.5,y-it.h*.9,hw*.12,it.h*.8)}
  if(word){
    const ty=y-it.h*(st.kind==='glass'?.3:.42),fs=Math.round(clamp(it.h*.14,12,24));
    ctx.font=`${fs}px "Dela Gothic One",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const wmax=interp(PROFILES[it.prof],st.kind==='glass'?.3:.42)*it.h*HWK*1.6;
    if(st.kind==='glass'){ctx.fillStyle='#efe6d2';ctx.fillRect(it.x-wmax/2-2,ty-fs*.9,wmax+4,fs*1.8);ctx.fillStyle='#2a211a'}
    else ctx.fillStyle=isLight(st.body)?'#1e2124':'#f7f3ec';
    ctx.fillText(word,it.x,ty+1,wmax);
  }
  ctx.restore();
  const tr=interp(PROFILES[it.prof],1)*it.h*HWK;ctx.fillStyle=shade(st.body,-.45);ctx.beginPath();ctx.ellipse(it.x,y-it.h,tr,Math.max(2,tr*.22),0,0,7);ctx.fill();
  ctx.restore();
}
function drawReticle(){
  const alive=items.some(i=>i.alive&&Math.abs(i.x-aimX)<slotW*.4);
  const x=aimX,y=shelfY-itemH*.48,r=16+Math.sin(clock*5)*2;
  ctx.save();ctx.strokeStyle=alive?'#ff5b24':'rgba(255,255,255,.55)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
  ctx.beginPath();for(const[a,b]of[[0,1],[0,-1],[1,0],[-1,0]]){ctx.moveTo(x+a*(r-6),y+b*(r-6));ctx.lineTo(x+a*(r+7),y+b*(r+7))}ctx.stroke();
  ctx.restore();
}
function drawPop(p){
  const k=p.t<.1?p.t/.1*1.25:p.t<.2?lerp(1.25,1,(p.t-.1)/.1):1+(p.t-.2)*.08;
  const a=p.t>.6?1-(p.t-.6)/.4:1;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.translate(p.x,p.y-p.t*20);ctx.rotate(p.rot);ctx.scale(k,k);
  ctx.font=`${p.size}px "Dela Gothic One",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.fillStyle='#ff5b24';ctx.fillText(p.text,p.size*.08,p.size*.08,W*.9);
  ctx.strokeStyle='#15171a';ctx.lineWidth=p.size*.16;ctx.strokeText(p.text,0,0,W*.9);
  ctx.fillStyle='#fff6ea';ctx.fillText(p.text,0,0,W*.9);
  ctx.restore();
}

/* ---------- ループ ---------- */
let prev=performance.now(),liveMag=0;
function frame(now){
  const dt=Math.min(.033,(now-prev)/1000);prev=now;clock+=dt;
  // 棚の補充
  if(restockAt&&clock>=restockAt){restock(true);setStatus('補充しました。まだまだ割れます')}
  items.forEach(it=>{
    if(it.yOff<0||it.vy!==0){it.vy+=G*dt;it.yOff+=it.vy*dt;if(it.yOff>=0){it.yOff=0;if(it.vy>220){it.vy*=-.22;sfx.clunk()}else{it.vy=0}}}
    if(it.wob>0){it.wobT+=dt;it.wob*=Math.exp(-4*dt)}
  });
  projs.forEach(p=>{p.t+=dt/p.dur;const t=Math.min(1,p.t);p.x=lerp(p.x0,p.tx,t);p.y=lerp(p.y0,p.ty,t)-p.arc*Math.sin(Math.PI*t);p.s=lerp(1.3,.5,Math.pow(t,.8));p.rot+=p.spin*dt;if(p.t>=1){impact(p);p.done=true}});
  projs=projs.filter(p=>!p.done);
  for(const f of frags){
    f.vy+=G*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;
    if(f.x<4){f.x=4;f.vx=Math.abs(f.vx)*.5}if(f.x>W-4){f.x=W-4;f.vx=-Math.abs(f.vx)*.5}
    if(f.y>=f.land&&f.vy>0){f.y=f.land;
      if(f.vy>H*.35){f.vy*=-rand(.18,.34);f.vx*=.6;f.vr*=.5;if(!f.ball&&Math.random()<.12)sfx.tink()}
      else{f.vy=0;f.vx*=Math.exp(-9*dt);f.vr*=Math.exp(-9*dt);f.rest+=dt;if(f.rest>.3){drawFrag(dx,f);f.dead=true}}}
  }
  frags=frags.filter(f=>!f.dead);
  dusts.forEach(d=>{d.life+=dt;d.vy+=G*.15*dt;d.vx*=.97;d.x+=d.vx*dt;d.y+=d.vy*dt});dusts=dusts.filter(d=>d.life<d.max);
  pops.forEach(p=>p.t+=dt/1);pops=pops.filter(p=>p.t<1);
  shake*=Math.exp(-10*dt);flash*=Math.exp(-9*dt);liveMag*=Math.exp(-6*dt);
  // 描画
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();
  if(shake>.3)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  ctx.drawImage(bg,0,0,W,H);ctx.drawImage(deb,0,0,W,H);
  items.forEach(it=>{if(it.alive)drawItem(it)});
  if(started)drawReticle();
  frags.forEach(f=>drawFrag(ctx,f));
  dusts.forEach(d=>{const a=1-d.life/d.max;ctx.fillStyle=d.glass?`rgba(235,250,255,${a})`:`rgba(200,196,188,${a*.55})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill()});
  projs.forEach(p=>{const r=projR*p.s;if(p.kind==='ball')drawBall(ctx,p.x,p.y,r,p.rot);else if(p.kind==='plate')drawPlate(ctx,p.x,p.y,r,p.rot);else drawCup(ctx,p.x,p.y,r,p.rot)});
  pops.forEach(drawPop);
  ctx.restore();
  if(flash>.01){ctx.fillStyle=`rgba(255,238,220,${flash})`;ctx.fillRect(0,0,W,H)}
  $('#meterLive').style.width=clamp(liveMag/SENS[sens].max*100,0,100)+'%';
  requestAnimationFrame(frame);
}

/* ---------- 振りの検出 ---------- */
const SENS={soft:{start:9,max:24},normal:{start:13,max:34},hard:{start:18,max:48}};
let motionOK=false,swing=null,cooldown=0;
function onMotion(e){
  const a=e.acceleration;let m;
  if(a&&a.x!=null)m=Math.hypot(a.x,a.y||0,a.z||0);
  else{const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;m=Math.abs(Math.hypot(g.x,g.y,g.z)-9.81)}
  motionOK=true;liveMag=Math.max(liveMag,m);
  if(!started||!$('#settings').hidden)return;
  const now=performance.now(),s=SENS[sens];
  if(!swing){if(m>s.start&&now>cooldown)swing={peak:m,t:now}}
  else{
    swing.peak=Math.max(swing.peak,m);
    if(m<swing.peak*.4||now-swing.t>320){
      const pk=swing.peak;swing=null;cooldown=now+650;
      throwIt(.25+.75*clamp((pk-s.start)/(s.max-s.start),0,1));
      if(pk>s.max*1.5)setStatus('かなり強い振りです。手元に気をつけて',true);
    }
  }
}

/* ---------- タップで狙う／はじいて投げる ---------- */
function setAim(x,snapK){let best=null,bd=1e9;items.forEach(it=>{const d=Math.abs(it.x-x);if(d<bd){bd=d;best=it}});aimX=best&&bd<slotW*snapK?best.x:clamp(x,12,W-12)}
let ptr=null;
cv.addEventListener('pointerdown',e=>{if(!started)return;sfx.resume();ptr={x:e.clientX,y:e.clientY,t:performance.now(),hist:[[e.clientX,e.clientY,performance.now()]]};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!ptr)return;ptr.hist.push([e.clientX,e.clientY,performance.now()]);if(ptr.hist.length>8)ptr.hist.shift()});
cv.addEventListener('pointerup',e=>{
  if(!ptr)return;const now=performance.now(),ddx=e.clientX-ptr.x,ddy=e.clientY-ptr.y,dt=now-ptr.t;
  if(Math.hypot(ddx,ddy)<14){setAim(e.clientX,.5);setStatus(motionOK?'スマホを振って投げる':'画面を上にはじいて投げる')}
  else if(ddy<-40&&dt<700){
    let h=ptr.hist[0];for(const q of ptr.hist){if(q[2]>=now-90){h=q;break}}
    const v=Math.max((h[1]-e.clientY)/Math.max(16,now-h[2]),-ddy/dt);
    const k=(ptr.y-shelfY)/Math.max(40,-ddy);
    setAim(ptr.x+ddx*k*.55,.3);
    throwIt(.25+.75*clamp((v-.5)/2.6,0,1));
  }
  ptr=null;
});
cv.addEventListener('pointercancel',()=>{ptr=null});

/* ---------- UI ---------- */
function setStatus(t,warn){const s=$('#status');s.textContent=t;s.classList.toggle('warn',!!warn)}
function radio(group,attr,val){document.querySelectorAll(`[data-${attr}]`).forEach(b=>b.setAttribute('aria-checked',b.dataset[attr]===val?'true':'false'))}
document.querySelectorAll('[data-obj]').forEach(b=>b.addEventListener('click',()=>{objKind=b.dataset.obj;radio(null,'obj',objKind)}));
document.querySelectorAll('[data-sens]').forEach(b=>b.addEventListener('click',()=>{sens=b.dataset.sens;radio(null,'sens',sens)}));
$('#btnSettings').addEventListener('click',()=>{$('#wordSet').value=word;$('#settings').hidden=false});
$('#btnClose').addEventListener('click',()=>{word=$('#wordSet').value.trim();$('#settings').hidden=true});
$('#wordSet').addEventListener('input',e=>{word=e.target.value.trim()});
$('#btnClean').addEventListener('click',()=>{dx.clearRect(0,0,W,H);frags=[];setStatus('床を片付けました')});
$('#btnRestock').addEventListener('click',()=>{restock(true);$('#settings').hidden=true});
$('#btnStart').addEventListener('click',async()=>{
  sfx.init();sfx.resume();
  word=$('#wordIntro').value.trim();
  let perm='granted';
  try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')perm=await DeviceMotionEvent.requestPermission()}catch(e){perm='denied'}
  if(perm==='granted')window.addEventListener('devicemotion',onMotion);
  started=true;$('#intro').hidden=true;
  setStatus('スマホを振って投げる。画面を上にはじいてもOK');
  setTimeout(()=>{if(!motionOK)setStatus('この環境では振りセンサーが使えません。画面を上にはじいて投げてください',true)},1600);
});
$('#total').textContent=total;

resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
