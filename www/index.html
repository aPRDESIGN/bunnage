<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121314">
<title>ぶん投げ部屋 Demo v0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 全画面の3D＋最小限のHUD。暗い単一テーマ */
:root{
  --bg:#121314;
  --ink:#f4f1ec;
  --ink-dim:#aeb3b7;
  --panel:rgba(18,19,21,.86);
  --line:rgba(255,255,255,.14);
  --accent:#ff5b24;
  --accent-ink:#1b0c05;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 50% 48%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
button{font-family:var(--f-body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* HOLDのパルス */
#pulse{position:fixed;left:50%;top:52%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid rgba(255,255,255,.85);pointer-events:none;transition:transform .12s,border-color .12s,background .12s}
#pulse::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,255,255,.6);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(3.2);opacity:0}}
body.holding #pulse{transform:scale(1.9);border-color:var(--accent);background:rgba(255,91,36,.22)}
body.holding #pulse::after{animation:none;opacity:0}
#tutorial{position:fixed;left:16px;right:16px;top:calc(52% + 40px);text-align:center;font-weight:700;font-size:17px;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.8);pointer-events:none}

/* 下のアイテムUI */
#itemBtn{position:fixed;left:50%;bottom:calc(var(--safe-b) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px 7px 10px;font-size:14px;font-weight:700}
#itemBtn svg{width:26px;height:26px}
#menuBtn{position:fixed;right:14px;top:calc(var(--safe-t) + 12px);width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;padding:0}
#menuBtn svg{width:18px;height:18px}
body.holding #itemBtn,body.holding #menuBtn,body.locked #itemBtn,body.locked #menuBtn{opacity:.35;pointer-events:none}

/* カルーセル */
#carousel{position:fixed;inset:0;background:rgba(0,0,0,.35)}
#dial{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 8px);display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px calc(50% - 60px) 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#dial::-webkit-scrollbar{display:none}
.dial-item{flex:0 0 120px;scroll-snap-align:center;display:grid;justify-items:center;gap:6px;background:none;border:0;padding:8px 0;opacity:.45;transform:scale(.78);transition:transform .15s,opacity .15s}
.dial-item svg{width:64px;height:64px}
.dial-item span{font-weight:700;font-size:14px}
.dial-item.on{opacity:1;transform:scale(1.08)}
#dialMark{position:absolute;left:50%;bottom:calc(var(--safe-b) + 6px);width:112px;height:128px;margin-left:-56px;border-radius:18px;background:rgba(18,19,21,.8);border:1px solid var(--line);pointer-events:none}

/* 画面（ステージ選択・アイテム選択） */
.screen{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(10,11,12,.55),rgba(10,11,12,.92));overflow-y:auto;padding:calc(var(--safe-t) + 40px) 20px calc(var(--safe-b) + 32px);display:flex}
.screen .inner{margin:auto;width:100%;max-width:420px;display:grid;gap:18px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.16em;color:var(--accent)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(46px,15vw,70px);line-height:1.02;text-shadow:5px 5px 0 var(--accent)}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px}
.lead{margin:0;font-size:16px;font-weight:700}
.stage-card{display:grid;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:18px 18px}
.stage-card b{font-family:var(--f-display);font-weight:400;font-size:24px}
.stage-card span{font-size:13px;color:var(--ink-dim)}
.soon{margin:0;font-size:12px;color:var(--ink-dim)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick button{display:grid;justify-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 6px 14px;font-weight:700;font-size:15px}
.pick svg{width:56px;height:56px}
.pick small{font-weight:500;font-size:11px;color:var(--ink-dim)}
.safety{margin:0;font-size:13px;line-height:1.6;color:#ffd6c2;border-left:3px solid var(--accent);padding-left:12px}

/* メニュー・確認 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(var(--safe-b) + 12px)}
.sheet .box{width:100%;max-width:420px;background:#1b1c1e;border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;gap:2px}
.sheet .row{display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-radius:10px;padding:14px 12px;font-size:16px;font-weight:700;text-align:left;width:100%}
.sheet .row:active{background:rgba(255,255,255,.06)}
.sheet .sub{font-size:12px;font-weight:500;color:var(--ink-dim);padding:2px 12px 8px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.toggle{width:44px;height:26px;border-radius:13px;background:#3a3c40;position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
[aria-checked="true"] .toggle{background:var(--accent)}
[aria-checked="true"] .toggle::after{transform:translateX(18px)}
#confirm{align-items:center}
#confirm .box{padding:22px 18px 16px;gap:16px}
#confirm p{margin:0;font-size:17px;font-weight:700;line-height:1.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border-radius:10px;padding:14px;font-size:16px;font-weight:700;border:1px solid var(--line);background:#2a2c2f}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1;pointer-events:auto}

#notice{position:fixed;left:14px;right:66px;top:calc(var(--safe-t) + 12px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.55;color:#ffd6c2}
#debug{position:fixed;left:10px;top:calc(var(--safe-t) + 12px);background:rgba(0,0,0,.62);border-radius:8px;padding:8px 10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#d8f0d0;pointer-events:none;white-space:pre;font-variant-numeric:tabular-nums}
#debug .bar{display:block;height:4px;background:var(--accent);margin-top:4px;border-radius:2px;width:0}
#rotate{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px;font-weight:700;font-size:18px}
@media (orientation:landscape) and (max-height:520px){#rotate{display:grid}}
@media (prefers-reduced-motion:reduce){#pulse::after{animation:none}}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "cannon-es": "./vendor/cannon-es.js" } }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-glass" viewBox="0 0 64 64"><path d="M18 8h28l-4 48H22z" fill="rgba(210,235,245,.25)" stroke="#dff2f8" stroke-width="3" stroke-linejoin="round"/><path d="M24 14l2 34" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/></symbol>
  <symbol id="i-egg" viewBox="0 0 64 64"><path d="M32 6c11 0 19 17 19 30a19 19 0 0 1-38 0C13 23 21 6 32 6z" fill="#f1e3cc"/><ellipse cx="25" cy="24" rx="4" ry="7" fill="#fff" opacity=".6"/></symbol>
  <symbol id="i-can" viewBox="0 0 64 64"><rect x="18" y="8" width="28" height="48" rx="4" fill="#1c5d8c"/><rect x="18" y="8" width="28" height="7" rx="3" fill="#cfd2d4"/><rect x="18" y="49" width="28" height="7" rx="3" fill="#cfd2d4"/><rect x="18" y="26" width="28" height="12" fill="#c8d6de"/></symbol>
  <symbol id="i-menu" viewBox="0 0 18 18"><path d="M2 4h14M2 9h14M2 14h14" stroke="#f4f1ec" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<canvas id="view"></canvas>
<div id="vignette"></div>
<div id="touch"></div>

<div id="hud" hidden>
  <div id="pulse"></div>
  <p id="tutorial" hidden>ここを押さえたまま、<br>スマホを振ってみよう</p>
  <button id="itemBtn" type="button" aria-label="投げるものを変える"><svg><use href="#i-glass"/></svg><span id="itemName">グラス</span></button>
  <button id="menuBtn" type="button" aria-label="メニュー"><svg><use href="#i-menu"/></svg></button>
  <div id="notice" hidden></div>
  <div id="debug" hidden></div>
</div>

<div id="carousel" hidden>
  <div id="dialMark"></div>
  <div id="dial">
    <button class="dial-item" data-kind="glass" type="button"><svg><use href="#i-glass"/></svg><span>グラス</span></button>
    <button class="dial-item" data-kind="egg" type="button"><svg><use href="#i-egg"/></svg><span>卵</span></button>
    <button class="dial-item" data-kind="can" type="button"><svg><use href="#i-can"/></svg><span>缶</span></button>
  </div>
</div>

<section id="stageScreen" class="screen">
  <div class="inner">
    <p class="eyebrow">DEMO v0.1</p>
    <h1>ぶん投げ<br>部屋</h1>
    <p class="lead">投げて、壊して、片付けない。</p>
    <button id="stageKitchen" class="stage-card" type="button"><b>キッチン</b><span>夜、ちょっと古いマンションの台所</span></button>
    <button id="stagePhoto" class="stage-card" type="button"><b>キッチン（写真）</b><span id="photoNote">同じ台所を写真風にした試作版</span></button>
    <p class="soon">ほかのステージは準備中です</p>
    <p class="safety">スマホは手から離さずに、しっかり握ったまま振ってください。まわりに人や物がないか確かめてから。</p>
  </div>
</section>

<section id="itemScreen" class="screen" hidden>
  <div class="inner">
    <h2>投げるものを選ぶ</h2>
    <div class="pick">
      <button data-kind="glass" type="button"><svg><use href="#i-glass"/></svg>グラス<small>パリーン</small></button>
      <button data-kind="egg" type="button"><svg><use href="#i-egg"/></svg>卵<small>ベチャッ</small></button>
      <button data-kind="can" type="button"><svg><use href="#i-can"/></svg>缶<small>カンッ</small></button>
    </div>
  </div>
</section>

<div id="menu" class="sheet" hidden>
  <div class="box">
    <button class="row" id="mClean" type="button">きれいにする</button>
    <button class="row" id="mStage" type="button">ステージを変える</button>
    <hr>
    <button class="row" id="mHit" type="button" role="switch" aria-checked="true">ぶつかったときの振動<span class="toggle"></span></button>
    <button class="row" id="mBreak" type="button" role="switch" aria-checked="true">壊れたときの振動<span class="toggle"></span></button>
    <div class="sub" id="hapNote"></div>
    <button class="row" id="mDebug" type="button" role="switch" aria-checked="false">調整用の数値を表示<span class="toggle"></span></button>
    <hr>
    <button class="row" id="mClose" type="button">閉じる</button>
  </div>
</div>

<div id="confirm" class="sheet" hidden>
  <div class="box">
    <p>ステージをきれいな状態に戻しますか？</p>
    <div class="btns"><button class="btn" id="cCancel" type="button">キャンセル</button><button class="btn primary" id="cOk" type="button">きれいにする</button></div>
  </div>
</div>

<div id="fade"></div>
<div id="rotate">縦向きで遊んでください</div>

<script type="module" src="./js/main.js?v=202609291758"></script>
</body>
</html>
